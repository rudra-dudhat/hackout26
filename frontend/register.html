<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create Account • Algae Carbon Monitor</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}body{font-family:Arial,Helvetica,sans-serif;min-height:100vh;background:linear-gradient(135deg,#ecfdf5,#f8fafc);display:flex;align-items:center;justify-content:center;color:#17211b}.box{width:min(420px,92vw);background:#fff;border:1px solid #e5e7eb;border-radius:20px;padding:32px;box-shadow:0 15px 50px rgba(0,0,0,.08)}.brand{display:flex;align-items:center;gap:12px;margin-bottom:25px}.icon{width:46px;height:46px;border-radius:12px;background:#0f766e;color:#fff;display:grid;place-items:center;font-size:24px}.brand h1{font-size:20px;color:#14532d}.brand p{font-size:12px;color:#6b7280;margin-top:3px}.title{font-size:26px;margin-bottom:7px}.sub{font-size:13px;color:#6b7280;margin-bottom:23px}label{display:block;font-size:13px;font-weight:700;margin:14px 0 7px}input{width:100%;padding:13px 14px;border:1px solid #d1d5db;border-radius:10px;font-size:14px;outline:none}input:focus{border-color:#0f766e;box-shadow:0 0 0 3px #ccfbf1}button{width:100%;padding:13px;border:0;border-radius:10px;background:#0f766e;color:white;font-weight:700;font-size:14px;cursor:pointer;margin-top:20px}button:hover{background:#115e59}.error{display:none;background:#fef2f2;color:#b91c1c;border:1px solid #fecaca;padding:10px 12px;border-radius:9px;font-size:12px;margin-top:15px}.bottom{text-align:center;font-size:13px;color:#6b7280;margin-top:20px}.bottom a{color:#0f766e;font-weight:700;text-decoration:none}.note{margin-top:18px;font-size:11px;color:#9ca3af;text-align:center}
</style>
</head>
<body>
<div class="box">
  <div class="brand"><div class="icon">🌿</div><div><h1>Algae Carbon Monitor</h1><p>Carbon Sequestration Monitoring Platform</p></div></div>
  <h2 class="title">Create account</h2>
  <p class="sub">Create an account to save your selected farm areas.</p>
  <form id="registerForm">
    <label>Full name</label><input id="name" type="text" autocomplete="name" required>
    <label>Email</label><input id="email" type="email" autocomplete="email" required>
    <label>Password</label><input id="password" type="password" minlength="6" autocomplete="new-password" required>
    <button type="submit">Create Account</button>
    <div id="error" class="error"></div>
  </form>
  <div class="bottom">Already have an account? <a href="/login.html">Login</a></div>
  <div class="note">Local student project • HackOut26</div>
</div>
<script>
document.getElementById("registerForm").addEventListener("submit", async e => {
  e.preventDefault();
  const error = document.getElementById("error");
  error.style.display = "none";
  try {
    const response = await fetch("/api/register", {
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({
        name:document.getElementById("name").value,
        email:document.getElementById("email").value,
        password:document.getElementById("password").value
      })
    });
    const data = await response.json();
    if (!response.ok) throw new Error(data.error || "Registration failed.");
    location.href = "/";
  } catch (err) {
    error.textContent = err.message;
    error.style.display = "block";
  }
});
</script>
</body>
</html>
